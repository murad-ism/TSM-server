services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "NsKaws13"
    ports:
      - "1433:1433"
    networks:
      - "tsm_net"
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo '[MSSQL] Checking health...' && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P NsKaws13 -Q 'SELECT 1' -N -C || (echo '[MSSQL] Health check failed!' && exit 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - "tsm_net"
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo '[Postgres] Checking health...' && pg_isready -U postgres || (echo '[Postgres] Health check failed!' && exit 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    networks:
      - "tsm_net"
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo '[Mongo] Checking health...' && mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || (echo '[Mongo] Health check failed!' && exit 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  test-runner:
    build:
      context: .
      dockerfile: ./TradingSystemsMonitoring.RestAPI/Dockerfile.tests
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      mssql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - "tsm_net"

  tradingsystemsmonitoring.restapi:
    build:
      context: .
      dockerfile: ./TradingSystemsMonitoring.RestAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    networks:
      - "tsm_net"
    depends_on:
      test-runner:
        condition: service_completed_successfully
      mssql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy

networks:
  tsm_net: