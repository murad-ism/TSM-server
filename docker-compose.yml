version: "3.8"

configs:
  prometheus_config:
    content: |
      global:
        scrape_interval: 5s

      scrape_configs:
        - job_name: "tsm-server-api"
          metrics_path: /metrics
          static_configs: 
            - targets: ["tsm-server-api:5000"]
  
services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "NsKaws13"
    ports:
      - "1433:1433"
    networks:
      - "tsm_net"
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo '[MSSQL] Checking health...' && /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P NsKaws13 -Q 'SELECT 1' -N -C || (echo '[MSSQL] Health check failed!' && exit 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    networks:
      - "tsm_net"
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo '[Postgres] Checking health...' && pg_isready -U postgres || (echo '[Postgres] Health check failed!' && exit 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:6
    ports:
      - "27017:27017"
    networks:
      - "tsm_net"
    healthcheck:
      test: [
        "CMD-SHELL",
        "echo '[Mongo] Checking health...' && mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || (echo '[Mongo] Health check failed!' && exit 1)"
      ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
      
  redis:
    image: redis:7.2
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - tsm_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  test-runner:
    build:
      context: .
      dockerfile: ./TradingSystemsMonitoring.RestAPI/Dockerfile.tests
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      mssql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    networks:
      - "tsm_net"

  tsm-server-api:
    build:
      context: .
      dockerfile: ./TradingSystemsMonitoring.RestAPI/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
      - ASPNETCORE_HTTP_PORTS=5000
    ports:
      - "5000:5000"
      - "5001:5001"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    networks:
      - "tsm_net"
    depends_on:
      test-runner:
        condition: service_completed_successfully
      mssql:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - default
      - tsm_net

  kafka1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    healthcheck:
      test: [
        "CMD-SHELL",
        "kafka-topics --bootstrap-server kafka1:29092 --list >/dev/null 2>&1 || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      - zookeeper
    networks:
      - default
      - tsm_net

  kafka2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka2
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29093,EXTERNAL://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka2:29093,EXTERNAL://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 2
    healthcheck:
      test: [
        "CMD-SHELL",
        "kafka-topics --bootstrap-server kafka2:29093 --list >/dev/null 2>&1 || exit 1"
      ]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 20s
    depends_on:
      - zookeeper
    networks:
      - default
      - tsm_net

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-lc"]
    command: >
      '
      kafka-topics --create \
        --topic trade-deals-topic \
        --partitions 3 \
        --replication-factor 2 \
        --if-not-exists \
        --bootstrap-server kafka1:29092
      '
    restart: "no"
    networks:
      - default
      - tsm_net

  prometheus:
    image: prom/prometheus
    ports:
      - "9090:9090"
    networks:
      - tsm_net
    configs:
      - source: prometheus_config
        target: /etc/prometheus/prometheus.yml
        mode: 0444

volumes:
  redis_data:

networks:
  tsm_net: