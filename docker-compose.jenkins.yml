version: "3.8"

services:
  jenkins:
    build:
      context: .
      dockerfile: ./ci/jenkins/Dockerfile
    container_name: jenkins
    user: root
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "desktop-control-plane:host-gateway"

volumes:
  jenkins_home:
