# UI: http://localhost:8080  → Topics → trade-deals-topic → Messages

services:
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: tsm-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:29092,kafka2:29093
    networks:
      - tsm_stack

networks:
  tsm_stack:
    external: true
    # Must match the default network of your main compose project (brokers live there).
    name: tsm-server_default
